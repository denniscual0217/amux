name: Codex Code Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, ready_for_review, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
        type: string

jobs:
  codex-review:
    name: Check:Codex-Review
    runs-on: ubuntu-latest
    if: |
      github.actor != 'github-actions[bot]' &&
      (
        github.event_name == 'pull_request' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && contains(github.event.comment.body, '@codex')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@codex'))
      )
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}
      pr_number: ${{ steps.pr.outputs.number }}
    steps:
      - name: Resolve PR number
        id: pr
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "number=${{ inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "pull_request_review_comment" ]]; then
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout pull request merge commit
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ steps.pr.outputs.number }}/merge
          fetch-depth: 0

      - name: Fetch pull request refs
        id: refs
        shell: bash
        run: |
          base_ref="$(gh pr view "$PR_NUMBER" --json baseRefName --jq .baseRefName)"
          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"
          git fetch --no-tags origin \
            "+refs/heads/$base_ref:refs/remotes/origin/$base_ref" \
            "+refs/pull/$PR_NUMBER/head:refs/remotes/pull/$PR_NUMBER/head"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}

      - name: Validate OpenAI API key
        shell: bash
        env:
          CODEX_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -z "$CODEX_OPENAI_API_KEY" ]]; then
            echo "::error::Set an Actions secret named OPENAI_API_KEY before running Codex review."
            exit 1
          fi

      - name: Run Codex review
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY || secrets.OPEN_API_KEY }}
          prompt: |
            Review PR #${{ steps.pr.outputs.number }} in ${{ github.repository }}.

            Use the instructions in .github/codex/prompts/review.md.

            Start by inspecting the pull request diff with:

            git diff --stat refs/remotes/origin/${{ steps.refs.outputs.base_ref }}...refs/remotes/pull/${{ steps.pr.outputs.number }}/head
            git diff refs/remotes/origin/${{ steps.refs.outputs.base_ref }}...refs/remotes/pull/${{ steps.pr.outputs.number }}/head

            Return only the review comment body. Do not edit files and do not post
            comments yourself.
          output-file: codex-review.md
          safety-strategy: drop-sudo
          sandbox: read-only

      - name: Post Codex review
        if: steps.run_codex.outputs.final-message != ''
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('codex-review.md', 'utf8').trim();
            const body = [
              '## Codex review',
              '',
              review,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body,
            });
