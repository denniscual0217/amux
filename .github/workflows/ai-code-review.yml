name: Code Review

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  ai-review:
    name: Check:AI-Review
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && github.event.review.body != null && contains(github.event.review.body, '@claude'))
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}

            You are an expert code reviewer with deep expertise in software
            engineering best practices, security analysis, and code quality
            assessment. Perform a comprehensive review of this pull request.

            Use any project-specific context in the repo's `CLAUDE.md`.

            The PR branch is already checked out in the working directory.

            ## How to post feedback

            - Use `mcp__github_inline_comment__create_inline_comment` (with
              `confirmed: true`) to post inline comments on the exact lines
              where issues live.
            - Use `gh pr comment` for the final summary (one top-level
              comment grouping findings by severity).
            - Only post GitHub comments — do NOT submit your review as chat
              output; the user won't see it otherwise.

            ## Review workflow

            1. Read the diff (`gh pr diff`) and identify modified, new, and
               deleted files.
            2. Review for:
               - Logical issues and potential bugs
               - Code style and consistency
               - Security vulnerabilities
               - Sub-optimal implementations and performance pitfalls
               - Error handling, edge cases, and race conditions
            3. Make sure every flagged issue is legitimate and actionable.
               Balance thoroughness with practicality — don't flag trivia.
               Call out strengths alongside weaknesses.
            4. Post one inline comment per issue. Then post a single
               top-level summary comment with findings grouped by severity
               (Critical, High, Medium, Low) plus positive observations
               and high-level recommendations.

            ## Per-finding format

            **[Severity]** Short title

            Description of the issue and why it matters.

            **Proposed solution**:

            ```<lang>
            fixed_code_example
            ```

            ## Rules

            - Do not duplicate findings from ESLint, TypeScript, Prettier,
              or other rule-based tooling that already runs in CI.
            - Ignore generated files, lock files, and snapshots.
          claude_args: |
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
