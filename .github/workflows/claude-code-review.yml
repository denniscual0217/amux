name: Code Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, ready_for_review, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string

concurrency:
  group: '${{ github.workflow }}-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}'
  cancel-in-progress: true

jobs:
  ai-review:
    name: Check:AI-Review
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Resolve PR branch for issue_comment
        if: github.event_name == 'issue_comment'
        uses: xt0rted/pull-request-comment-branch@v2.0.0
        id: comment-branch

      - name: Checkout project
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.comment-branch.outputs.head_ref || '' }}
          fetch-depth: 0

      - name: Run Claude Code review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}

            You are an expert code reviewer with deep expertise in software
            engineering best practices, security analysis, and code quality
            assessment.

            Use the checked-out repository and git history to inspect the
            pull request diff. Focus on issues that are legitimate,
            actionable, and likely to matter to the maintainer.

            ## What to review

            - Logical bugs and behavior regressions
            - Security vulnerabilities
            - Error handling gaps and edge cases
            - Race conditions or lifecycle issues
            - Performance problems with realistic impact
            - Code style or consistency problems only when they materially
              affect maintainability

            ## Rules

            - Do not make code changes.
            - Do not duplicate findings from TypeScript, formatting, or
              other rule-based CI.
            - Ignore generated files, lock files, and snapshots unless the
              change itself is the bug.
            - Prefer a short review with no findings over speculative
              comments.
            - If there are no meaningful findings, say that clearly.

            ## Priority labels

            Every finding must have exactly one priority label:
            - `[P0]` — high priority: bugs that corrupt data, security
              vulnerabilities, crashes, broken behavior, data loss.
            - `[P1]` — medium priority: everything else (perf, error
              handling, minor refactors, style).

            ## Workflow

            1. Use the checked-out repo, `gh pr diff`, `Glob`, `Grep`, and
               `Read` to understand the diff and trace impact across files.
            2. For every finding, post an inline comment using
               `mcp__github_inline_comment__create_inline_comment` —
               anchored to the most relevant line in the diff. Do this
               BEFORE writing the summary. Capture the URL (or comment id)
               returned by the tool for each inline comment.
            3. Post a single top-level summary comment via `gh pr comment`.

            ## Inline comment format

            Use a colored badge for the priority, followed by the finding
            description. No title line.

            For P0:
            ![P0 – High Priority](https://img.shields.io/badge/P0-High%20Priority-red)

            Description of the issue and why it matters.

            **Proposed solution (optional)**:

            ```<lang>
            fixed_code_example
            ```

            For P1:
            ![P1 – Medium Priority](https://img.shields.io/badge/P1-Medium%20Priority-orange)

            Description of the issue and why it matters.

            **Proposed solution (optional)**:

            ```<lang>
            fixed_code_example
            ```

            ## Summary format

            Write a top-level summary comment with this exact structure:

            ## 🔍 Review Summary

            ## 💬 General Feedback (optional — omit if there is nothing
            meaningful to add beyond the inline comments)

            Example:

            ```markdown
            ## 🔍 Review Summary
            This PR introduces automated code review via GitHub Actions,
            improving the team's ability to catch issues early. The
            changes are well-structured, but one configuration issue
            should be resolved before merging.

            ## 💬 General Feedback
            - The new CI workflow is a valuable addition to the pipeline.
            - The PR also includes minor refactoring in the RoB Calendar
              components for better layout consistency.
            ```
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Edit,Write,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git status:*),Bash(git diff:*)"

      - name: Post review summary to Slack
        if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'ready_for_review')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_REVIEW_WEBHOOK_URL }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          AUTHOR="${{ github.event.pull_request.user.login }}"

          SUMMARY=$(gh pr view "$PR_NUMBER" \
            --json comments \
            --jq '[.comments[] | select(.body | startswith("## 🔍 Review Summary"))] | last | .body // ""')

          if [ -z "$SUMMARY" ]; then
            exit 0
          fi

          ESCAPED=$(echo "$SUMMARY" | python3 -c "
          import sys, json
          print(json.dumps(sys.stdin.read()))
          ")

          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            --data "{
              \"blocks\": [
                {
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": \"*AI Code Review:* <$PR_URL|$PR_TITLE> by $AUTHOR\"
                  }
                },
                {
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": $ESCAPED
                  }
                },
                {
                  \"type\": \"divider\"
                },
                {
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": \"_To fix issues, reply in this thread:_ \`@Claude fix <issue> in PR #$PR_NUMBER in ${{ github.repository }} — push to the PR branch, no new PR\`\"
                  }
                }
              ]
            }"



