name: Code Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, ready_for_review, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string

jobs:
  ai-review:
    name: Check:AI-Review
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Resolve PR branch for issue_comment
        if: github.event_name == 'issue_comment'
        uses: xt0rted/pull-request-comment-branch@v2
        id: comment-branch

      - name: Checkout project
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.comment-branch.outputs.head_ref || '' }}
          fetch-depth: 0

      - name: Run Claude Code review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}

            You are an expert code reviewer reviewing a GitHub pull request
            for this repository.

            Use the checked-out repository and git history to inspect the
            pull request diff. Focus on issues that are legitimate,
            actionable, and likely to matter to the maintainer.

            ## What to review

            - Logical bugs and behavior regressions
            - Security vulnerabilities
            - Error handling gaps and edge cases
            - Race conditions or lifecycle issues
            - Performance problems with realistic impact
            - Code style or consistency problems only when they materially
              affect maintainability

            ## Rules

            - Do not make code changes.
            - Do not duplicate findings from TypeScript, formatting, or
              other rule-based CI.
            - Ignore generated files, lock files, and snapshots unless the
              change itself is the bug.
            - Prefer a short review with no findings over speculative
              comments.
            - If there are no meaningful findings, say that clearly.

            ## Priority labels

            Every finding must have exactly one priority label:
            - `[P0]` — urgent / critical: bugs that corrupt data, security
              vulnerabilities, crashes, broken behavior, data loss.
            - `[P1]` — everything else: high, medium, or low impact
              improvements (perf, error handling, minor refactors, style).

            ## Workflow

            1. Use the checked-out repo, `gh pr diff`, `Glob`, `Grep`, and
               `Read` to understand the diff and trace impact across files.
            2. For every finding, post an inline comment using
               `mcp__github_inline_comment__create_inline_comment` —
               anchored to the most relevant line in the diff. Do this
               BEFORE writing the summary. Capture the URL (or comment id)
               returned by the tool for each inline comment.
            3. Post a single top-level summary comment via `gh pr comment`.

            ## Inline comment format

            **[P0] Short title**  (or **[P1] Short title**)

            Description of the issue and why it matters.

            **Proposed solution (optional)**:

            ```<lang>
            fixed_code_example
            ```

            ## Summary format

            Start with a short overview of what the PR changes and the
            overall verdict. Then list every finding as a flat `-` bullet
            — no sections, no grouping.

            Each bullet must start with the priority label, include the
            file and line, and end with a link to the inline comment. If
            the tool only returns a comment id, build the URL as
            `https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}#discussion_r<id>`.

            Example:

            ```markdown
            This PR adds X and Y. The core idea is solid; a few issues
            need attention before merging.

            - **[P0] EPERM silently treated as "no process"** —
              `src/server.ts:34`.
              ([Comment link](https://github.com/owner/repo/pull/3#discussion_r222))
            - **[P1] Hardcoded 300 ms SIGTERM wait** — `src/cli.ts:325`.
              ([Comment link](https://github.com/owner/repo/pull/3#discussion_r333))
            ```

            Formatting rules:
            - Each bullet: `**[P0] Title**` or `**[P1] Title**` — file:line.
            - Every bullet ends with `([Comment link](<url>))`.
            - No sections, no sub-bullets, no code fences in the summary.
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Edit,Write,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git status:*),Bash(git diff:*)"

