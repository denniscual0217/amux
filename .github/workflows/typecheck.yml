name: Typecheck

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  typecheck:
    name: Check:Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run build
